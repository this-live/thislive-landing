# this.live landing: single nginx static service (Railway, behind Cloudflare).
#
# One service serves the site at this.live and, by Host routing, the archived
# pillar pages on their own subdomains if DNS for those is ever configured.
# Pillar pages moved to /archive/<pillar>/ in the 2026-10 consulting pivot; the
# old public URLs 301 there so existing links and search results keep working.

# Map the request Host to the page served at "/".
map $host $pillar_home {
    default                 "/index.html";
    bryce.this.live         "/bryce.html";
    cortex.this.live        "/archive/cortex/index.html";
    maestro.this.live       "/archive/maestro/index.html";
    mnemos.this.live        "/archive/mnemos/index.html";
    fabric.this.live        "/archive/fabric/index.html";
    surfaces.this.live      "/archive/surfaces/index.html";
    forge.this.live         "/archive/forge/index.html";
}

# www is an alias: send it to the canonical apex so search engines see one host.
server {
    listen 8080;
    server_name www.this.live;
    return 301 https://this.live$request_uri;
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx defaults to absolute redirects, which leaked the internal :8080
    # port into public trailing-slash redirects (Cloudflare 522). Keep
    # redirects relative to the public host.
    absolute_redirect off;
    port_in_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Real 404s (with a 404 status) instead of serving the homepage for every
    # unknown URL. The old catch-all made /sitemap.xml return homepage HTML.
    error_page 404 /404.html;
    location = /404.html { internal; }

    # Pillar subdomain landing (exact "/" only); apex/www get the homepage.
    location = / {
        try_files $pillar_home /index.html =404;
    }

    # Superseded URLs from before the pivot.
    location ~ ^/(cortex|maestro|mnemos|fabric|surfaces|forge)/?$ {
        return 301 /archive/$1/;
    }
    location ~ ^/(cortex|maestro|mnemos|surfaces)/(cortex|maestro|mnemos|surfaces)-hero\.js$ {
        return 301 /archive/$1/$2-hero.js;
    }
    location ~ ^/work-with-me/?$ {
        return 301 /services/;
    }

    # Long-lived caching for fingerprinted or rarely-changing static assets.
    location ~* \.(?:woff2|png|jpe?g|webp|svg|ico)$ {
        expires 30d;
        try_files $uri =404;
    }
    location ~* \.(?:css|js)$ {
        expires 1d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
